server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: h2
  application:
    name: library-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.library.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: library-system-secret-key-2024-jwt-token
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# 借阅配置
borrow:
  max-days: 30
  max-renew-count: 2
  fine-per-day: 0.50
  max-borrow-count: 5

# 日志配置
logging:
  level:
    com.library: debug
    org.springframework: info

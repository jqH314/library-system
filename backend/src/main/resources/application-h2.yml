server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: library-system
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:library;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.library.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: library-system-secret-key-2024-jwt-token
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

borrow:
  max-days: 30
  max-renew-count: 2
  fine-per-day: 0.50
  max-borrow-count: 5

logging:
  level:
    com.library: debug
